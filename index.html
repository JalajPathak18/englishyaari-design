<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnglishYaari Admin · Call Audit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: faithful build of the EnglishYaari admin Figma — calm, dense, operational.
   IDEA: the Call Audit module of the Sales CRM, working end to end.
   PICTURE: the tables, report and charts themselves.
   COLOUR and TYPE: the file's own tokens — brand #6D28D9, sidebar #28253B, Urbanist.
   LAYOUT: 280px dark sidebar, 80px top bar, 24px content gutter, as in the file. */
:root{color-scheme:light;--z:1;
--brand:#6d28d9;--brand2:#f5f3ff;--brand3:#ebe7ff;--brand100:#ede8ff;--brand300:#c7b4ff;
--ink:#060a17;--ink2:#58687e;--ink3:#8799b2;--title:#343861;
--line:#eff2f6;--line2:#dfe5ec;--bg:#fafafa;--card:#fff;--head:#f7f7f7;
--side:#28253b;--sideA:#1c1928;--sideB:#353146;
--ok:#199a41;--ok2:#ecfcf1;--okD:#127635;--warn:#b73913;--warn2:#fff6e7;--warnB:#f76507;--err:#da1f22;--teal:#14b8a6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 Urbanist,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input{font:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:calc(100vh / var(--z))}
body{zoom:var(--z)}
/* sidebar */
.side{width:280px;flex:none;background:var(--side);color:#fff;padding:32px 20px 40px;position:sticky;top:0;height:calc(100vh / var(--z));overflow-y:auto;z-index:30}
.logo{display:flex;align-items:center;gap:8px;justify-content:center;font-size:26px;font-weight:700;letter-spacing:-.3px;margin-bottom:32px}
.logo b{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--side);display:grid;place-items:center;font-size:24px;line-height:1;padding-bottom:3px}
.nav{display:flex;flex-direction:column;gap:16px}
.nv{display:flex;align-items:center;gap:13px;height:48px;padding:0 12px;border-radius:8px;font-size:16px;border:1px solid transparent;width:100%;text-align:left}
.nv:hover{background:#322e47}
.nv.grp{background:var(--sideA);border-color:var(--sideB)}
.nv.grp .car{margin-left:auto;transition:transform .2s}
.nv.grp:not(.closed) .car{transform:rotate(180deg)}
.sub{display:flex;flex-direction:column}
.sub.closed{display:none}
.sub .nv{padding-left:20px}
.sub .nv.on{background:var(--sideA)}
/* top bar */
.main{flex:1;display:flex;flex-direction:column}
.top{height:80px;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:flex-end;gap:24px;padding:0 32px;position:sticky;top:0;z-index:20}
.burger{margin-right:auto;display:none;width:44px;height:44px;border-radius:10px;place-items:center}
.bell{width:54px;height:54px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:#3d3d3d;position:relative}
.bell::after{content:"";position:absolute;top:15px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--err);border:2px solid var(--bg)}
.me{height:54px;border-radius:57px;background:var(--bg);display:flex;align-items:center;gap:12px;padding:0 14px 0 6px;color:#656565;font-size:16px;font-weight:600}
.me .av{width:42px;height:42px;font-size:15px}
/* page */
.view{padding:24px clamp(16px,2vw,40px) 48px;max-width:1760px;width:100%;margin:0 auto}
.ph{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.ph .t{flex:1 1 280px}
.ph h1{margin:0 0 10px;font-size:24px;font-weight:600;color:var(--title);line-height:1.2}
.ph p{margin:0;font-size:18px;color:var(--title)}
.crumb a{color:var(--title)}.crumb a:hover{color:var(--brand);text-decoration:underline}
.range{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.rb{background:#fff;border:.5px solid #f1f0f5;border-radius:8px;padding:8px 14px;font-size:16px;color:var(--title);white-space:nowrap;display:flex;align-items:center;gap:24px}
.rb:hover{border-color:var(--brand300)}
.rb.on{background:var(--brand3);border-color:var(--brand);color:var(--brand)}
.stack{display:flex;flex-direction:column;gap:20px}
.seg{display:inline-flex;gap:4px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:10px;align-self:flex-start}
.seg>*{padding:8px 16px;border-radius:8px;color:var(--ink2);white-space:nowrap}
.seg>a:hover,.seg>button:not(.on):hover{background:var(--brand2)}
.seg>.on{background:var(--brand);color:#fff;font-weight:600}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line)}
.tabs button{font-size:15px;color:var(--ink2);padding-bottom:10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);font-weight:700;border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.kpi .l{color:var(--ink2);font-size:14px}
.kpi .v{display:flex;align-items:baseline;gap:0 8px;white-space:nowrap;flex-wrap:wrap}
.kpi .v b{font-size:28px;line-height:36px;font-weight:700}
.kpi .v>span{font-weight:600;font-size:14px}
.up{color:var(--ok)}.dn{color:var(--err)}.mut{color:var(--ink3)}
.bar6{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.bar6 i{display:block;height:100%;background:var(--brand);border-radius:99px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tool{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:0 12px;height:40px;width:260px;color:var(--ink3);background:#fff}
.search input{border:0;outline:0;flex:1;font-size:14px;color:var(--ink);background:none;height:100%}
.search input::placeholder{color:var(--ink3)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px 8px 12px;background:#fff;white-space:nowrap;font-size:14px}
.fbtn:hover{border-color:var(--brand300)}
.fbtn.on{background:var(--brand2);border-color:var(--brand);color:var(--brand)}
.fbtn .n{background:var(--brand);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}
.fbtn svg{width:16px;height:16px;transition:transform .15s}
.fbtn.open svg{transform:rotate(180deg)}
.scroll{overflow-x:auto}
.tbl{min-width:var(--mw,1000px)}
.tr{display:grid;grid-template-columns:var(--cols);align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}
.tr.h{white-space:nowrap;background:var(--head);height:40px;color:var(--ink2);font-size:13px;font-weight:500}
.tr.h.s{font-size:12px;font-weight:600}
.tr.r{min-height:68px}
.tr.r.m{min-height:56px}
.tr.r:hover{background:#fcfbff}
.who{display:flex;gap:12px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.nm{font-weight:700;font-size:14px;white-space:nowrap}
.sm{font-size:12px;color:var(--ink3);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:16px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-Renewal{background:var(--brand2);color:var(--brand)}.c-Subscribed{background:var(--ok2);color:var(--okD)}
.c-Demo{background:var(--warn2);color:var(--warn)}.c-Signup{background:var(--line);color:var(--ink2)}
.pt{background:var(--brand2);color:var(--brand);font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.ratio{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600}
.ratio .lt{color:#94a3b8}
.oc{display:inline-flex;align-items:center;gap:6px;border:1px solid #e4e7ec;border-radius:8px;padding:5px 8px 5px 10px;font-size:13px;white-space:nowrap;background:#fff}
.oc:hover{border-color:var(--brand300)}
.oc svg{width:14px;height:14px;color:var(--ink3)}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.vbtn{display:inline-flex;align-items:center;gap:6px;background:var(--brand2);color:var(--brand);border-radius:8px;padding:5px 12px 5px 10px;font-weight:600;font-size:13px}
.vbtn:hover{background:var(--brand3)}
.vbtn svg{width:14px;height:14px}
.pag{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:var(--ink2);font-size:13px}
.pag div{display:flex;gap:8px;align-items:center}
.pb{width:32px;height:32px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;background:#fff}
.pb:disabled{opacity:.4;cursor:default}
.pb svg{width:16px;height:16px}
.empty{padding:40px 16px;text-align:center;color:var(--ink2)}
.empty button{color:var(--brand);font-weight:600;margin-top:6px}
/* learners */
.chev{width:28px;display:flex;color:var(--ink2)}.chev svg{width:18px;height:18px;transition:transform .15s}
.tr.r.open{background:var(--brand2)}.tr.r.open .chev svg{transform:rotate(90deg)}
.tr.r.clk{cursor:pointer}
.act b{color:var(--ink);font-weight:700}
.ung{color:var(--warn);font-weight:600;font-size:12px}
.gh{display:flex;align-items:center;gap:10px;padding:0 16px 0 46px;height:36px;font-size:12px;border-bottom:1px solid var(--line)}
.gh b{font-weight:700}.gh .cnt{margin-left:auto;color:var(--ink);font-weight:700}
.gh.u{background:var(--warn2);color:var(--warn)}.gh.s{background:var(--ok2);color:var(--okD)}
.gh.u .d,.gh.s .d{color:var(--ink2);font-weight:500}
.tl{position:relative;display:flex;align-items:center;gap:12px;height:100%}
.tl::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--line2)}
.tl i{width:9px;height:9px;border-radius:50%;background:var(--brand);position:relative;z-index:1}
.tl i.o{background:#fff;border:1.5px solid var(--ink3)}
.dir{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px}
.dir svg{width:15px;height:15px;color:var(--brand)}.dir.in svg{color:var(--ok)}
.int{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.int.High{background:var(--ok2);color:var(--okD)}.int.Medium{background:var(--warn2);color:var(--warn)}.int.Low{background:var(--line);color:var(--ink2)}
.np{color:var(--err);font-size:12px;font-weight:600}
/* report */
.sum{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px;flex-wrap:wrap}
.sum h2{margin:0;font-size:20px;font-weight:700;display:flex;gap:8px;align-items:center}
.sum p{margin:6px 0 0;color:var(--ink2)}
.mark{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative}
.mb{display:flex;align-items:center;gap:6px;border:1px solid;border-radius:8px;padding:8px 14px 8px 12px;font-weight:600;background:#fff}
.mb svg{width:16px;height:16px}
.mb.ok{border-color:var(--ok);color:var(--ok)}.mb.ok.on{background:var(--ok);color:#fff}
.mb.no{border-color:var(--err);color:var(--err)}.mb.no.on{background:var(--err);color:#fff}
.ib{width:38px;height:38px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;background:#fff}
.ib svg{width:18px;height:18px}
.rec{display:flex;align-items:center;gap:16px;padding:16px 20px}
.play{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px}
.wave{flex:1;display:flex;gap:3px;align-items:center;height:32px;cursor:pointer;overflow:hidden}
.wave{justify-content:space-between}.wave i{flex:0 1 3px;border-radius:2px;background:var(--line2)}
.wave i.p{background:var(--brand)}
.tm{font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.spd{border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;min-width:38px}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.pad{padding:20px;display:flex;flex-direction:column;gap:14px}
.pad h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.pr{display:grid;grid-template-columns:220px minmax(0,1fr) 40px;gap:12px;align-items:center}
.pr .w{font-size:12px;color:var(--ink3);margin-left:6px}
.trk{height:8px;border-radius:4px;background:var(--brand100);overflow:hidden}.trk i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .5s}
.pr b{text-align:right}
.hl{display:flex;gap:8px}.hl b{width:12px}
.hr{height:1px;background:var(--line)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--ok2);color:var(--okD)}
.prow{display:flex;align-items:center;gap:12px}
.prow .dt{width:10px;height:10px;border-radius:50%;background:var(--brand);flex:none}
.prow b{width:80px;font-size:16px;flex:none}
.prow span{flex:1;color:var(--ink2)}
.ts{color:var(--brand);font-weight:600;font-size:13px;white-space:nowrap}.ts:hover{text-decoration:underline}
.split{display:flex;gap:3px}.split i{height:6px;border-radius:3px}
.orow{display:flex;align-items:center;gap:10px}.orow span{flex:1}
.lines{display:flex;flex-direction:column;gap:2px}
.ln{display:flex;gap:12px;padding:6px 10px;border-radius:8px;cursor:pointer}
.ln:hover{background:#faf9ff}.ln.on{background:var(--brand2)}
.ln .t{width:36px;flex:none;color:var(--ink3);font-size:12px;line-height:20px}
.ln .s{font-weight:600;font-size:13px;color:var(--brand)}.ln .s.L{color:var(--okD)}
.ln p{margin:2px 0 0;line-height:21px}
mark{background:#fde68a;border-radius:2px}
.jump{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink3);font-size:13px}
.jump button{border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink2);display:flex;gap:6px}
.jump button span{color:var(--brand)}
/* analytics */
.acard{background:#fff;border:1px solid #eceaf2;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:20px}
.acard h3{margin:0;font-size:18px;font-weight:700;color:#111318}
.big{font-size:32px;font-weight:700;color:#262524;white-space:nowrap}
.lab{font-size:16px;color:#666476}
.cols{display:flex;gap:12px;align-items:flex-end;height:150px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.col i{display:block;width:100%;background:var(--brand300);border-radius:6px 6px 0 0;transition:height .4s}
.col.hi i{background:var(--brand)}.col.hi b,.col.hi span{color:var(--brand)}
.col span{color:var(--ink2)}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 104px;gap:16px;align-items:center;font-size:16px;color:#262524}
.hb .tk{height:28px;background:#f8f8f8;border-radius:6px;overflow:hidden}.hb .tk i{display:block;height:100%;border-radius:6px;transition:width .5s}
.hb .val{text-align:right;white-space:nowrap}.hb .val span{color:#666476}
.hbars{display:flex;flex-direction:column;gap:24px}
.tod{display:flex;gap:32px;align-items:flex-end}
.slots{flex:1;display:flex;gap:8px}
.slot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:214px;padding:10px 4px;border-radius:12px;font-size:13px;color:var(--ink2);text-align:center}
.slot.hi{background:#f6f1fe;color:var(--brand)}
.slot .bs{display:flex;gap:6px;align-items:flex-end}
.slot .bs div{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-weight:600}
.slot .bs i{display:block;width:30px;border-radius:6px 6px 0 0;transition:height .4s}
.slot small{font-size:12px;color:var(--ink3)}.slot.hi small{color:var(--brand);font-weight:600}
.lg{display:flex;gap:16px;font-size:13px;color:var(--ink2)}.lg span{display:flex;gap:6px;align-items:center}.lg i{width:10px;height:10px;border-radius:3px}
.pnp{display:flex;gap:3px;height:12px}.pnp i{border-radius:6px;transition:width .4s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:1px solid #eceaf2;border-radius:14px;padding:12px 16px}
.tile p{margin:0 0 6px;display:flex;gap:8px;align-items:center;color:#666476}
.tile b{font-size:24px;color:#262524;white-space:nowrap}
.aw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px}
.sortb{display:inline-flex;gap:4px;align-items:center;font-weight:600}.sortb.on{color:var(--brand)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none}
/* menus, toast */
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:6px;min-width:200px;max-height:340px;overflow:auto;display:none}
.menu.show{display:block}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;text-align:left;white-space:nowrap;font-size:14px}
.mi:hover{background:var(--brand2)}
.mi .cb{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;flex:none}
.mi.on .cb{background:var(--brand);border-color:var(--brand);color:#fff}
.mi .cb svg{width:12px;height:12px;stroke-width:2.4}
.mi.sel{color:var(--brand);font-weight:600}
.mfoot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding:8px 6px 2px}
.mfoot button{color:var(--brand);font-weight:600;font-size:13px}
.pop{padding:14px;min-width:280px}
.pop label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.pop textarea,.pop input{width:100%;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;font:inherit;font-size:16px;resize:vertical}
.pop .row{display:flex;gap:8px;margin-top:10px}
.btn{background:var(--brand);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.g{background:#fff;color:var(--ink2);border:1px solid var(--line2)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:12px;color:var(--ink3);margin-top:12px}
.scrim{display:none}
@media(max-width:1100px){.two,.aw{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1000px){
 .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
 .side.show{transform:none}
 .scrim.show{display:block;position:fixed;inset:0;background:rgba(6,10,23,.4);z-index:25}
 .burger{display:grid}.top{padding:0 16px;gap:12px}}
@media(max-width:600px){.me>span:not(.av),.me svg{display:none}.me{padding:0 6px}.view{padding:16px}.search{width:100%}.pr{grid-template-columns:minmax(0,1fr) 40px}.pr .trk{grid-column:1/-1;grid-row:2}.tod{flex-direction:column;align-items:stretch}.slots{overflow-x:auto}.slot{min-width:96px}.hb{grid-template-columns:80px minmax(0,1fr) 84px;font-size:14px}.tiles{grid-template-columns:1fr}}
@media(max-width:720px){

 <div class="card"><div class="tool">${searchBox(key,'Search learner')}<div class="filters">${fbtn(key,'member','All members')}${fbtn(key,'type','User type')}${fbtn(key,'emph','Emphasised plan')}</div></div>
 <div class="scroll"><div class="tbl cards" style="--mw:1040px;${cols}"><div class="tr h s"><span>Member</span><span>Learner</span><span>User type</span><span>Score</span><span>Emphasised</span><span>Duration</span><span>Marked by</span><span>Why</span><span>Report</span></div>
 ${rows.map(r=>`<div class="tr r m"><span style="color:var(--ink2);font-size:13px">${esc(r.member)}</span><b style="font-weight:600;font-size:13px">${esc(r.name)}</b><span>${chip(r.type)}</span><b style="font-size:13px">${score(r.score)}</b><span><span class="pt">${r.emph||r.plans?.[0]||'—'}</span></span><b style="font-weight:600;font-size:13px">${r.dur}</b><span style="color:var(--ink2);font-size:13px">${esc(r.by||'Abhinav')}</span><span style="color:var(--ink2);font-size:13px">${esc(r.why||'—')}</span><span><a class="vbtn" href="#report-${r.id}">${ic('play')}View</a></span></div>`).join('')||`<div class="empty">${ok?'No successful calls match.':'No failed calls match.'}</div>`}
 </div></div>${foot}</div><p class="note">Open any report and use “Mark call” to add it here. Sample data.</p></div>`}

/* ---------- 7 analytics ---------- */
const MEMS=[['Harshit',386,78,'5m 12s',7.6,25],['Amrita',412,74,'4m 05s',7.1,22],['Priya',301,71,'4m 20s',6.9,15],['Sachin',355,69,'3m 48s',6.4,14],['Shreya',280,70,'3m 31s',6.2,10],['Bushra',214,88,'6m 10s',7.5,null],['Satyam',198,90,'5m 55s',7.3,null]];
function viewAnalytics(){const tf={all:1,sales:.73,support:.27}[S.aType],m=MEMS.find(x=>x[0]===S.aMem),mf=m?m[1]/2146:1,f=rf()*tf*mf,cf=S.aType==='support'?0:rf()*(m?(m[5]||0)/86:1);
 const cv=[4,8,12,15,25,22].map(v=>v*cf),cmax=Math.max(...cv,1);const conv=Math.round(86*cf);
 const plans=[['6-Month',612,'#d1b7fa'],['3-Month',401,'#b18bf1'],['12-Month',302,'#9563e7'],['1-Month',150,'#7c3edd']],pmax=612;
 const tod=[['8:00 – 11:59 AM',412,11],['12:00 – 2:59 PM',468,14],['3:00 – 5:59 PM',521,17],['6:00 – 8:59 PM',584,31],['9:00 – 11:59 PM',391,13]],tmax=584;
 const durs=[['Under 2 min',690,'#d1b7fa'],['2–5 min',902,'#b18bf1'],['5–10 min',546,'#9563e7'],['10+ min',238,'#7c3edd']];
 const tot=2376*f,pk=1819*f,np=557*f;
 const sorted=[...MEMS].sort((a,b)=>{const i={calls:1,picked:2,dur:3,score:4,conv:5}[S.sortK];const x=i===3?sec(a[3].replace(/m |s/g,':').replace(/:$/,'')):(a[i]??-1),y=i===3?sec(b[3].replace(/m |s/g,':').replace(/:$/,'')):(b[i]??-1);return (x-y)*S.sortD});
 const sh=(k,l)=>`<button class="sortb ${S.sortK===k?'on':''}" data-sort="${k}">${l}${S.sortK===k?(S.sortD<0?' ↓':' ↑'):''}</button>`;
 return pageHead('Call Analytics','How the team is calling')+`<div class="stack"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div class="seg">${[['all','All calls'],['sales','Sales'],['support','Support']].map(([k,l])=>`<button class="${S.aType===k?'on':''}" data-atype="${k}">${l}</button>`).join('')}</div><button class="fbtn ${S.aMem?'on':''}" id="amem">${S.aMem||'All members'}${ic('down')}</button></div>
 <div class="aw"><div class="acard"><h3>Calls to convert</h3><div><div class="lab">Median per conversion</div><div style="display:flex;gap:10px;align-items:baseline"><span class="big">${conv?'5 calls':'—'}</span><span class="mut">${conv?`avg 4.6 · ${conv} converted`:'No conversions for this view'}</span></div></div>
 <div class="cols">${cv.map((v,i)=>`<div class="col ${i===4?'hi':''}" data-tip="${Math.round(v)} learners converted on call ${i<5?i+1:'6 or later'}"><b>${Math.round(v)}</b><i style="height:${Math.max(2,v/cmax*76)}px"></i><span>${i<5?i+1:'6+'}</span></div>`).join('')}</div><div class="sm" style="text-align:center">Calls made before purchase</div></div>
 <div class="acard"><h3>Emphasised plans</h3><div class="hbars">${plans.map(([l,v,c])=>`<div class="hb"><span>${l}</span><div class="tk"><i style="width:${v/pmax*100}%;background:${c}"></i></div><span class="val"><b>${fmt(v*f)}</b> <span>(${Math.round(v/1465*100)}%)</span></span></div>`).join('')}</div></div></div>
 <div class="acard"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h3>${S.aType==='support'?'Support':'Sales'} calls by time of day</h3><div class="mut" style="margin-top:4px">Calls made vs converted in each time slot</div></div><div class="lg"><span><i style="background:#d9c8fb"></i>Calls made</span><span><i style="background:var(--brand)"></i>Converted</span></div></div>
 <div class="tod"><div style="width:230px;padding-bottom:8px"><div class="lab">Best time to call</div><div class="big">6 – 9 PM</div><div class="mut">5.3% conversion · ${Math.round(31*cf)} of ${conv} converted</div></div>
 <div class="slots">${tod.map(([l,c,v],i)=>`<div class="slot ${i===3?'hi':''}" data-tip="${fmt(c*f)} calls · ${Math.round(v*cf)} converted"><div class="bs"><div>${fmt(c*f)}<i style="height:${c/tmax*104}px;background:#d9c8fb"></i></div><div style="${i===3?'color:var(--brand)':''}">${Math.round(v*cf)}<i style="height:${v/31*104*(cf?1:0)+2}px;background:var(--brand)"></i></div></div><span>${l}</span><small>${(v/c*100).toFixed(1)}% converted</small></div>`).join('')}</div></div></div>
 <div class="aw"><div class="acard"><h3>Picked vs not picked</h3><div><div class="lab">Total calls</div><div class="big">${fmt(tot)}</div></div><div class="pnp"><i style="width:77%;background:#27ae60"></i><i style="flex:1;background:#eb5757"></i></div>
 <div class="tiles"><div class="tile"><p><i class="dot" style="width:8px;height:8px;background:#27ae60"></i>Picked</p><b>${fmt(pk)} (77%)</b></div><div class="tile"><p><i class="dot" style="width:8px;height:8px;background:#eb5757"></i>Not picked</p><b>${fmt(np)} (23%)</b></div></div></div>
 <div class="acard"><h3>Call duration</h3><div class="hbars">${durs.map(([l,v,c])=>`<div class="hb"><span>${l}</span><div class="tk"><i style="width:${v/902*100}%;background:${c}"></i></div><span class="val"><b>${fmt(v*f)}</b> <span>(${Math.round(v/2376*100)}%)</span></span></div>`).join('')}</div></div></div>
 <div class="card" style="border-radius:16px;padding:20px 0 8px"><h3 style="margin:0 0 16px 24px;font-size:18px;font-weight:600">By member</h3><div class="scroll"><div class="tbl" style="--mw:860px;--cols:minmax(160px,1.4fr) repeat(5,minmax(100px,1fr))"><div class="tr h s" style="padding:0 24px"><span>Member</span>${sh('calls','Calls')}${sh('picked','Picked')}${sh('dur','Avg duration')}${sh('score','Avg score')}${sh('conv','Converted')}</div>
 ${sorted.map(r=>`<div class="tr r" style="min-height:48px;padding:0 24px;${r[0]===S.aMem?'background:var(--brand2)':''}"><b style="font-weight:600">${r[0]}</b><span>${fmt(r[1]*rf())}</span><span>${r[2]}%</span><span>${r[3]}</span><span>${r[4]}</span><b class="${r[5]?'up':''}">${r[5]!=null?Math.round(r[5]*rf()):'—'}</b></div>`).join('')}</div></div></div>
 <p class="note">Sample data. Pick a member, call type or date range and every chart updates.</p></div>`}

/* ---------- router ---------- */
function render(){closeMenu();const h=location.hash.slice(1)||'call-audit';const v=$('#view');
 if(!h.startsWith('report-')){S.from=h;if(PL.playing)setPlay(false)}
 v.innerHTML=h.startsWith('report-')?viewReport(h.slice(7)):h==='learners-calls'?viewLearners():h==='successful-calls'?viewSucc():h==='call-analytics'?viewAnalytics():viewLogs();
 side();updPlayer();$('#side').classList.remove('show');$('#scrim').classList.remove('show')}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});

/* ---------- events ---------- */
const openF=(k,f)=>{const nb=document.querySelector(`[data-k="${k}"][data-f="${f}"]`);if(!nb)return;const F=fl(k);F[f]=F[f]||[];multiMenu(nb,FOPTS[f](k),F[f],()=>{S.page[k]=1;render();openF(k,f)})};
const FOPTS={member:k=>(k==='logs-support'?SUPPORT:MEMBERS).map(v=>({v})),type:()=>UT.map(v=>({v})),intent:()=>['High','Medium','Low','—'].map(v=>({v,l:v==='—'?'Not picked':v})),
 outcome:()=>Object.entries(S.logTab==='sales'?OUT:OUT_SUP).map(([v,dot])=>({v,dot})),dur:()=>['Not picked','Under 2 min','2–5 min','5–10 min','10+ min'].map(v=>({v})),ung:()=>['Has ungrouped calls','All grouped'].map(v=>({v})),emph:()=>['1M','3M','6M','12M'].map(v=>({v}))};
document.addEventListener('click',e=>{const t=e.target.closest('button,a,[data-learner],.ln,#wave');if(!t)return;const d=t.dataset;
 if(t.classList.contains('x'))return toast('This prototype covers the Sales CRM → Call Audit screens');
 if(t.id==='crm'){S.crm=!S.crm;return side()}
 if(t.id==='burger'){$('#side').classList.add('show');$('#scrim').classList.add('show');return}
 if(t.id==='bell')return toast('No new notifications');if(t.id==='me')return toast('Signed in as Abhinav Vats');
 if(d.range){if(d.range==='custom')return customPop(t);S.range=d.range;return render()}
 if(d.logtab){S.logTab=d.logtab;return render()}
 if(d.f){e.stopPropagation();if(menuBtn===t)return closeMenu();closeMenu();return openF(d.k,d.f)}
 if(d.oc){e.stopPropagation();if(menuBtn===t)return closeMenu();closeMenu();const r=REC[d.oc],outs=r.kind==='sales'?OUT:OUT_SUP;return singleMenu(t,Object.entries(outs).map(([v,dot])=>({v,dot})),r.outcome,v=>{r.outcome=v;r.intent=intentOf(v,r.dur);render();toast(`${r.name}: outcome set to ${v}`)})}
 if(d.pg){S.page[d.pg]=(S.page[d.pg]||1)+(+d.d);render();return}
 if(d.clear!==undefined){S.f[d.clear]={};S.q[d.clear]='';render();return}
 if(d.learner){const n=d.learner;S.open.has(n)?S.open.delete(n):S.open.add(n);return render()}
 if(d.rtab){S.rTab=d.rtab;return render()}
 if(d.succ){S.succTab=d.succ;return render()}
 if(d.atype){S.aType=d.atype;return render()}
 if(t.id==='amem'){e.stopPropagation();if(menuBtn===t)return closeMenu();return singleMenu(t,[{v:'',l:'All members'},...MEMS.map(m=>({v:m[0]}))],S.aMem,v=>{S.aMem=v;render()})}
 if(d.sort){S.sortD=S.sortK===d.sort?-S.sortD:-1;S.sortK=d.sort;return render()}
 if(t.id==='pbtn')return setPlay(!PL.playing);
 if(t.id==='spd'){PL.rate=PL.rate===1?1.5:PL.rate===1.5?2:1;t.textContent=PL.rate+'x';return}
 if(t.id==='wave'){const r=t.getBoundingClientRect();PL.t=Math.max(0,Math.min(PL.len,(e.clientX-r.left)/r.width*PL.len));return updPlayer()}
 if(d.seek!==undefined){PL.t=+d.seek;setPlay(true);if(d.scroll&&S.rTab==='transcript'){const ln=[...document.querySelectorAll('.ln')].find(l=>+l.dataset.t>=PL.t);ln?.scrollIntoView({block:'center',behavior:'smooth'})}return}
 if(d.mark){e.stopPropagation();return markPop(t,d.mark)}
 if(t.id==='copyT'){const r=REC[location.hash.slice(8)],R=report(r);const txt=R.lines.map(([s,w,x])=>`${mmss(s)}  ${w==='M'?r.member:r.name.split(' ')[0]}: ${x}`).join('\n');navigator.clipboard?.writeText(txt).then(()=>toast('Transcript copied'),()=>toast('Copy was blocked by the browser'));return}
});
$('#scrim').onclick=()=>{$('#side').classList.remove('show');$('#scrim').classList.remove('show')};
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.dataset?.learner){e.preventDefault();t.click()}
 if(t.id==='wave'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){PL.t=Math.max(0,Math.min(PL.len,PL.t+(e.key==='ArrowRight'?5:-5)));updPlayer()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q!==undefined){S.q[t.dataset.q]=t.value;S.page[t.dataset.q]=1;const pos=t.selectionStart;render();const n=document.querySelector(`[data-q="${t.dataset.q}"]`);n.focus();n.setSelectionRange(pos,pos)}
 if(t.id==='tq'){S.tq=t.value;const pos=t.selectionStart;render();const n=$('#tq');n.focus();n.setSelectionRange(pos,pos)}});

function customPop(btn){const m=$('#menu');m.innerHTML=`<div class="pop"><label for="cf">From</label><input type="date" id="cf" value="2026-10-01"><label for="ct" style="margin-top:10px">To</label><input type="date" id="ct" value="2026-10-16"><div class="row"><button class="btn" data-a="ok">Apply</button><button class="btn g" data-a="x">Cancel</button></div></div>`;
 menuCb=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='ok'){const a=new Date($('#cf').value),z=new Date($('#ct').value),n=Math.round((z-a)/864e5)+1;if(!(n>0))return toast('Pick an end date after the start date');S.range='custom';S.custom=n;closeMenu();render();toast(`Showing ${n} days`)}else closeMenu()};placeMenu(btn)}
function markPop(btn,kind){const r=REC[location.hash.slice(8)];const cur=r.ok===true?'ok':r.ok===false?'no':null;
 if(cur===kind){r.ok=undefined;render();return toast('Mark removed')}
 const m=$('#menu');m.innerHTML=`<div class="pop"><label for="why">${kind==='ok'?'What makes this a good example?':'What went wrong on this call?'}</label><textarea id="why" rows="3" placeholder="${kind==='ok'?'e.g. Clean close on price':'e.g. Missed the price objection'}"></textarea><div class="row"><button class="btn" data-a="ok">Save</button><button class="btn g" data-a="x">Cancel</button></div></div>`;
 menuCb=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='ok'){r.ok=kind==='ok';r.markedAt=Date.now();r.why=$('#why').value.trim()||(kind==='ok'?'Good example':'Needs coaching');r.by='Abhinav';r.emph=r.emph||r.plans?.[0]||'—';closeMenu();render();toast(kind==='ok'?'Added to Successful Calls':'Added to Failed calls')}else closeMenu()};placeMenu(btn);setTimeout(()=>$('#why')?.focus(),30)}

render();
}
</script>
